name: TaxLounge one-off dependency remediation

on:
  push:
    branches: [design/portfolio-craft-wave2-2026-10-31]

permissions:
  contents: write

concurrency:
  group: taxlounge-deps-oneoff
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install known lockfile
        run: npm ci
      - name: Update build-only dependency and vulnerable runtime validation dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev vite-plugin-pwa@^1.3.0
          if git grep -l -E "(from ['\"]zod['\"]|require\(['\"]zod['\"]\)|zodResolver)" -- src | grep -q .; then
            echo 'Zod is imported by app code: install patched v4 and require full compatibility tests'
            npm install --save zod@^4.6.7
          else
            echo 'No application Zod import found: remove the unused direct dependency'
            npm uninstall zod
          fi
          npm audit fix --ignore-scripts || echo 'Remaining advisories will be assessed by the final production audit'
          npm install --package-lock-only --ignore-scripts
      - name: Gate dependency compatibility, build and security
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint:security
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit only passing lockfile changes and retire this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/taxlounge-dependency-remediation.yml
          git add -- package.json package-lock.json
          git diff --cached --check
          git commit -m 'Fix TaxLounge runtime dependency audit with verified lockfile updates'
          git push origin HEAD:refs/heads/design/portfolio-craft-wave2-2026-10-31
          echo 'Dependency remediation committed; pull request CI must be rerun and checked at the new head.'
