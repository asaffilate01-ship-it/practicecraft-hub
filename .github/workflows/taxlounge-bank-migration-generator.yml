name: TaxLounge bank migration generator and database gate

on:
  push:
    branches: [codex/taxlounge-bank-database-guards-20261031]

permissions:
  contents: write

concurrency:
  group: taxlounge-bank-migration-generator
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Generate named Supabase migration using the CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new taxlounge_bank_role_integrity
          file="$(find supabase/migrations -maxdepth 1 -name '*_taxlounge_bank_role_integrity.sql' -type f | sort | tail -1)"
          test -n "$file"
          cp supabase/migration_drafts/taxlounge_bank_role_integrity.sql "$file"
          echo "MIGRATION_PATH=$file" >> "$GITHUB_ENV"
      - name: Replay all migrations and verify database regression tests
        run: |
          supabase start
          supabase db reset --local
          supabase test db
      - name: Commit generated and validated migration then self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$MIGRATION_PATH"
          git rm -- supabase/migration_drafts/taxlounge_bank_role_integrity.sql .github/workflows/taxlounge-bank-migration-generator.yml
          git diff --cached --check
          git commit -m 'Enforce TaxLounge bank RLS, client integrity and reviewed journal posting'
          git push origin HEAD:refs/heads/codex/taxlounge-bank-database-guards-20261031
