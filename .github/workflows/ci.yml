name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check AI and Factory Edge Functions
        run: |
          mkdir -p "$RUNNER_TEMP/practice-edge-check"
          cp -R supabase/functions/_shared supabase/functions/ai-intelligence supabase/functions/ai-categorise supabase/functions/receipt-ocr supabase/functions/omniqora-bridge "$RUNNER_TEMP/practice-edge-check/"
          cd "$RUNNER_TEMP/practice-edge-check"
          deno check --no-config --no-lock --node-modules-dir=none ai-intelligence/index.ts ai-categorise/index.ts receipt-ocr/index.ts omniqora-bridge/index.ts
      - run: npm run typecheck
      - run: npm run lint:security
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  migration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate local migration chain
        run: supabase start && supabase db reset --local
      - name: Payroll review database tests
        run: supabase test db
