name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check AI and Factory Edge Functions
        run: |
          mkdir -p "$RUNNER_TEMP/practice-edge-check"
          cp -R supabase/functions/_shared supabase/functions/ai-intelligence supabase/functions/ai-categorise supabase/functions/receipt-ocr supabase/functions/omniqora-bridge supabase/functions/open-banking "$RUNNER_TEMP/practice-edge-check/"
          cd "$RUNNER_TEMP/practice-edge-check"
          deno check --no-config --no-lock --node-modules-dir=none ai-intelligence/index.ts ai-categorise/index.ts receipt-ocr/index.ts omniqora-bridge/index.ts open-banking/index.ts
      - run: npm run typecheck
      - run: npm run lint:security
      - name: Lint TaxLounge workspace and role-aware shortcuts
        run: npx eslint src/pages/PracticeOperations.tsx src/lib/workQueuePreferences.ts src/components/layout/MobileBottomNav.tsx src/test/workQueuePreferences.test.ts src/test/practiceOperationsUi.test.tsx
      - name: Lint supervised receipt and OCR review workspaces
        run: npx eslint src/pages/ReceiptReviewQueue.tsx src/components/bookkeeping/ReceiptUploader.tsx src/lib/receiptReview.ts src/test/receiptReviewPreview.test.ts src/test/receiptReviewContracts.test.ts
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Critical advisory audit (including dev tooling)
        run: npm audit --audit-level=critical

  migration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin a verified stable CLI to avoid rate-limited 'latest' release lookups.
          version: 2.122.0
      - name: Validate local migration chain
        run: supabase start && supabase db reset --local
      - name: Payroll review database tests
        run: supabase test db
