name: TaxLounge one-off test-toolchain critical advisory remediation
on:
  push:
    branches: [design/portfolio-craft-wave2-2026-10-31]
permissions:
  contents: write
concurrency:
  group: taxlounge-vitest-oneoff
  cancel-in-progress: true
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade test runner to address critical tinypool advisory
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --save-dev vitest@^5.0.5
          npm install --package-lock-only --ignore-scripts
      - name: Verify all app tests and full-tree critical advisory gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint:security
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Publish proven update and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/taxlounge-vitest-remediation.yml
          git add -- package.json package-lock.json
          git diff --cached --check
          git commit -m 'Upgrade TaxLounge test runner and close critical development advisory'
          git push origin HEAD:refs/heads/design/portfolio-craft-wave2-2026-10-31
